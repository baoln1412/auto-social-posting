<!doctype html><meta charset="utf-8"><title>mock · Thư viện</title><link rel="stylesheet" href="mock.css">
<style>
.tools{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1;display:flex;align-items:center;gap:8px;padding:8px 12px}
.search svg{width:16px;height:16px;stroke:var(--soft)}.search span{color:var(--soft)}
.seg{display:inline-flex;border:2.5px solid var(--pen);border-radius:var(--r);overflow:hidden;box-shadow:3px 3px 0 var(--pen);background:var(--card)}
.seg span{padding:7px 10px;display:grid;place-items:center}.seg span.on{background:var(--accent);color:#fff}.seg svg{width:15px;height:15px}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:12px}
.tabs span{padding:8px 12px;font-weight:600;color:var(--muted);font-size:14px;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs span.on{color:var(--accent);border-color:var(--accent)}
.tabs .plus{margin-left:auto;color:var(--soft)}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.filters select,.filters input{padding:6px 9px;font-size:13px;font-weight:600;border-width:2px;box-shadow:2px 2px 0 var(--pen)}
.filters .n{margin-left:auto;font-size:13px;color:var(--muted)}
.day{display:flex;align-items:baseline;gap:8px;margin:6px 0 10px}.day h3{font-size:15px}.day .num{color:var(--soft);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.post{overflow:hidden}
.hero{position:relative;aspect-ratio:2.1/1;background:var(--stage)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .ov{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:12px}
.hero .ov .r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.hero .ov b{font-weight:700}
.hero .tag{background:#fff;color:var(--ink);border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700;border:1.5px solid var(--pen)}
.hero .tag.red{background:var(--bad);color:#fff}.hero .tag.amber{background:#F8EF63;color:var(--ink)}
.hero .src{position:absolute;top:10px;left:12px}
.hero .vid{position:absolute;top:10px;right:10px;width:46px;aspect-ratio:9/16;border-radius:6px;border:2px solid #fff;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.hero .vid img{width:100%;height:100%;object-fit:cover}
.body{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.body h4{margin:0;font:700 15px/1.3 'Source Sans 3';display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.body .orig{font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;align-items:center;margin-top:4px}
.acts .btn{flex:1}.acts .id{margin-left:auto;font-size:11px;color:var(--soft)}
.steps{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted)}
.steps i{width:18px;height:18px;border-radius:99px;border:2px solid var(--pen);display:grid;place-items:center;font:600 10px 'Source Code Pro';background:var(--card);font-style:normal}
.steps i.done{background:var(--accent);color:#fff}.steps i.run{background:#F8EF63}
</style>
<body><script src="icons.js"></script><script src="shell.js"></script>
<script>
const steps=(n,run)=>`<span class="steps">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'done':(i===run?'run':'')}">${i}</i>`).join('')}<span style="margin-left:4px">${n===5?'Đã đăng':n===4?'Video xong · chờ đăng':run?'Đang render…':'Chưa có video'}</span></span>`;
const post=(img,src,topic,when,title,orig,status,statusCls,n,run,vid)=>`
<div class="card post">
  <div class="hero"><img src="${img}">
    <span class="src tag">${src}</span>${vid?`<span class="vid"><img src="${vid}"></span>`:''}
    <div class="ov"><div class="r"><span class="tag ${topic[1]}">${topic[0]}</span><span>· ${when}</span><span style="margin-left:auto" class="num">Source ↗</span></div></div>
  </div>
  <div class="body">
    <h4><span>${title}</span><span class="badge ${statusCls}">${status}</span></h4>
    <div class="orig">Original: ${orig}</div>
    ${steps(n,run)}
    <div class="acts"><a class="btn sm primary"><svg><use href="#video"/></svg>${n>=4?'Xem video':'Tạo video'}</a><a class="btn sm"><svg><use href="#image"/></svg>Sửa ảnh</a><a class="btn sm"><svg><use href="#send"/></svg>Đăng</a><span class="id num">#ad946cff</span></div>
  </div>
</div>`;
shell({page:'library',title:'Thư viện',sub:'Kho bài của bạn — mỗi bài là một thẻ, video và ảnh nằm ngay trên thẻ',body:`
<div class="tools">
  <div class="card search"><svg><use href="#search"/></svg><span>Tìm theo tiêu đề, link nguồn, kênh hoặc mã…</span></div>
  <select style="box-shadow:3px 3px 0 var(--pen);border-width:2.5px;font-weight:600"><option>Mới nhất trước</option></select>
  <span class="seg"><span class="on"><svg><use href="#grid"/></svg></span><span><svg><use href="#list"/></svg></span></span>
  <span class="btn icon"><svg><use href="#refresh"/></svg></span>
  <a class="btn primary"><svg><use href="#sparkles"/></svg>Tạo video</a>
</div>
<div class="tabs"><span class="on">US · Tin định cư Mỹ</span><span>GB · UK</span><span>IN · India / NRI</span><span>VN · Vietnam</span><span>Others</span><span>Germany</span><span>Australia</span><span>Kỳ án</span><span class="plus">+</span></div>
<div class="filters">
  <select><option>Mọi nguồn</option></select><select><option>Mọi chủ đề</option></select>
  <input type="text" value="20/09/2026" style="width:118px"><span class="help">đến</span><input type="text" value="24/09/2026" style="width:118px">
  <select><option>Mọi trạng thái</option></select><select><option>Video: chưa có</option></select>
  <span class="n"><span class="num">1.771</span> bài · <span class="num">19</span> video</span>
</div>
<div class="day"><h3>Hôm nay</h3><span class="num">8</span></div>
<div class="grid">
${post('img/post-0.jpg','KTLA (Mỹ)',['An toàn cộng đồng','red'],'23/09 18:13','🇺🇸 Mỹ: Cụ bà 82 tuổi ở Pomona bị lừa mất 2.500 đô vì chiêu vé số trúng thưởng — người Việt lớn tuổi cần cảnh giác 🎟️','Pomona woman, 82, loses $2,500 in lottery scam','Video xong','green',4,0,'img/frame-a.png')}
${post('img/post-1.jpg','LA Times — California',['Cộng đồng Người Việt Hải ngoại','amber'],'23/09 18:12','🇺🇸 Mỹ: Bảo hiểm nhà ở California chao đảo vì cháy rừng, hàng trăm ngàn hộ phải dùng bảo hiểm dự phòng','California home insurance market in turmoil after wildfires','Draft','grey',2,3,'')}
</div>`});
</script></body>
