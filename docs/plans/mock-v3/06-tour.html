<!doctype html><meta charset="utf-8"><title>mock · Tour</title><link rel="stylesheet" href="mock.css">
<style>
.hero{text-align:center;margin:10px 0 6px}
.hero h1{font-size:40px;font-weight:800}.hero h1 em{color:var(--accent);font-style:italic;font-weight:700}
.rail{display:flex;justify-content:center;gap:6px;margin:10px 0 16px}
.rail .chip{border-color:var(--line);background:transparent;color:var(--muted)}.rail .chip svg{stroke:var(--accent)}
.box{max-width:640px;margin:0 auto;padding:0}
.box textarea{width:100%;border:0;background:transparent;resize:none;height:96px;padding:16px 18px;font-size:16px;outline:0}
.box textarea::placeholder{color:var(--soft)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:2px solid var(--line)}
.bar select{padding:5px 8px;font-size:13px;font-weight:600;border-width:2px}
.door{max-width:640px;margin:14px auto 0;display:flex;align-items:center;gap:12px;padding:10px 14px}
.door .ic{width:34px;height:34px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;border:2px solid var(--pen)}
.door .ic svg{width:17px;height:17px;stroke:var(--accent)}
.door b{display:block;font-size:14px}.door span{font-size:12px;color:var(--muted)}
.sugg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:720px;margin:0 auto}
.sg{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.sg .src{display:flex;align-items:center;gap:8px}.sg .src b{font-size:14px}.sg .src small{display:block;font-size:11px;color:var(--soft)}
.sg .src .btn{margin-left:auto}
.sg p{margin:0;font-size:14px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sg .meta{display:flex;gap:12px;font-size:12px;color:var(--muted)}.sg .meta span{display:inline-flex;align-items:center;gap:4px}.sg .meta svg{width:13px;height:13px}
.recent{display:flex;gap:12px;max-width:720px;margin:0 auto}
.flag{width:22px;height:22px;border-radius:6px;border:2px solid var(--pen);background:var(--faint);display:grid;place-items:center;font-size:12px}
</style>
<body><script src="icons.js"></script><script src="shell.js"></script>
<script>
shell({page:'create',title:'Tạo video',body:`
<div class="hero"><h1>Dựng <em>video mới</em></h1></div>
<div class="rail">
  <span class="chip"><svg><use href="#filetext"/></svg>Đọc bài</span><span class="chip"><svg><use href="#pen"/></svg>Viết bài</span>
  <span class="chip"><svg><use href="#image"/></svg>Ảnh</span><span class="chip"><svg><use href="#video"/></svg>Video</span><span class="chip"><svg><use href="#send"/></svg>Đăng</span>
</div>
<div class="card box">
  <textarea placeholder="Dán link Threads / Reddit / Facebook / bài báo vào đây, hoặc viết nội dung…"></textarea>
  <div class="bar">
    <span class="btn ghost icon"><svg><use href="#list"/></svg></span>
    <select><option>Nguồn: tự nhận từ link</option></select>
    <select><option>Kênh: Tin định cư Mỹ</option></select>
    <span class="grow"></span>
    <select><option>Tuỳ chỉnh: mặc định</option></select>
    <span class="btn primary icon"><svg><use href="#video"/></svg></span>
  </div>
</div>
<div class="card quiet door">
  <span class="ic"><svg><use href="#rss"/></svg></span>
  <div class="grow"><b>Nguồn tự động · Tin định cư Mỹ</b><span>Chạy <span class="num">4</span> giờ/lần · lần cuối <span class="num">2</span> giờ trước · <span class="num">8</span> bài mới chưa có video</span></div>
  <a class="btn sm">Thiết lập</a><a class="btn sm primary">Chạy ngay</a>
</div>

<div class="sec" style="max-width:720px;margin:22px auto 10px"><h3><svg><use href="#sparkles"/></svg>Gợi ý từ kho nguồn</h3><span class="help">Bài Gold mới nhất chưa có video</span></div>
<div class="sugg">
  <div class="card sg"><div class="src"><span class="flag">🇺🇸</span><div><b>KTLA (Mỹ)</b><small>Kho nguồn · 2 giờ trước</small></div><span class="btn sm icon"><svg><use href="#video"/></svg></span></div>
    <p>Mỹ: Cụ bà 82 tuổi ở Pomona bị lừa mất 2.500 đô vì chiêu vé số trúng thưởng — người Việt lớn tuổi cần cảnh giác</p>
    <div class="meta"><span><svg><use href="#heart"/></svg><span class="num">204</span></span><span><svg><use href="#msg"/></svg><span class="num">31</span></span><span class="badge green">Gold</span></div></div>
  <div class="card sg"><div class="src"><span class="flag">🇺🇸</span><div><b>LA Times — California</b><small>Kho nguồn · 2 giờ trước</small></div><span class="btn sm icon"><svg><use href="#video"/></svg></span></div>
    <p>Mỹ: Bảo hiểm nhà ở California chao đảo vì cháy rừng, hàng trăm ngàn hộ phải dùng bảo hiểm nhà nước</p>
    <div class="meta"><span><svg><use href="#heart"/></svg><span class="num">96</span></span><span><svg><use href="#msg"/></svg><span class="num">12</span></span><span class="badge green">Gold</span></div></div>
</div>

<div class="sec" style="max-width:720px;margin:22px auto 10px"><h3><svg><use href="#clock"/></svg>Kết quả gần đây</h3><span class="help">Video giữ trên đĩa của bạn — không hết hạn</span><span class="more">Xem tất cả (<span class="num">19</span>) →</span></div>
<div class="recent">
  <div class="thumb"><img src="img/frame-b.png"><span class="t">22:04</span><span class="play"><b><svg style="width:14px;height:14px"><use href="#play"/></svg></b></span></div>
  <div class="thumb"><img src="img/frame-a.png"><span class="t">18:31</span><span class="play"><b><svg style="width:14px;height:14px"><use href="#play"/></svg></b></span></div>
  <div class="thumb" style="background:var(--faint);border-style:dashed;box-shadow:none"><span class="play" style="color:var(--soft);font-size:12px;text-align:center;padding:10px">đang render…<br><span class="num">3/5</span></span></div>
</div>`});
</script>
<style>
.scrim{position:fixed;inset:0;z-index:50;pointer-events:none}
.tt{position:fixed;z-index:51;width:300px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tt .eyebrow{color:var(--accent)}.tt h3{font-size:18px}.tt p{margin:0;font-size:13.5px;color:var(--muted)}
.tt .f{display:flex;align-items:center;gap:8px;margin-top:6px}.tt .f .sp{flex:1}
.tt .dots{display:flex;gap:4px}.tt .dots i{width:6px;height:6px;border-radius:99px;background:var(--line)}.tt .dots i.on{background:var(--accent)}
</style>
<script>
(function(){
  const box=document.querySelector('.box').getBoundingClientRect(), pad=8, r=14;
  const W=innerWidth,H=innerHeight;const x=box.left-pad,y=box.top-pad,w=box.width+pad*2,h=box.height+pad*2;
  const ring=`M${x+r},${y}h${w-2*r}a${r},${r},0,0,1,${r},${r}v${h-2*r}a${r},${r},0,0,1,-${r},${r}h-${w-2*r}a${r},${r},0,0,1,-${r},-${r}v-${h-2*r}a${r},${r},0,0,1,${r},-${r}z`;
  document.body.insertAdjacentHTML('beforeend',`<svg class="scrim" width="${W}" height="${H}"><path fill-rule="evenodd" fill="rgba(31,29,24,.6)" d="M0,0H${W}V${H}H0Z ${ring}"/><path d="${ring}" fill="none" stroke="#2F6B4F" stroke-width="3"/></svg>
  <div class="card tt" style="left:${x+w-300}px;top:${y+h+16}px"><span class="eyebrow">Tổng quan Studio · <span class="num">1/8</span></span><h3>Bắt đầu tại Tạo video</h3><p>Dán một link — Threads, Reddit, Facebook hay bài báo — hoặc để Nguồn tự động chọn bài. Studio tự nhận nguồn từ link.</p>
  <div class="f"><a class="btn sm ghost">Bỏ qua</a><span class="sp"></span><span class="dots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><a class="btn sm primary">Tiếp tục</a></div></div>`);
})();
</script></body>
