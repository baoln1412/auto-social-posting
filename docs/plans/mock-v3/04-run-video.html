<!doctype html><meta charset="utf-8"><title>mock · Bước Video</title><link rel="stylesheet" href="mock.css"><link rel="stylesheet" href="run.css">
<style>
.scene{padding:10px 12px;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.scene.reply{margin-left:26px;border-color:var(--pen2);box-shadow:none}
.scene .h{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.scene .h .chip{padding:1px 8px;font-size:10.5px;background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.scene .h .acts{margin-left:auto;display:flex;gap:6px}
.scene p{margin:0;font-size:14.5px;font-weight:600;line-height:1.4}
.scene textarea{font-size:14.5px;font-weight:600;line-height:1.4;padding:6px 8px;border-color:var(--accent);background:var(--accent-tint);resize:none;height:56px}
.cm{display:flex;align-items:center;gap:10px;margin:14px 0 8px}
.cm h3{font-size:14px}.cm .num{color:var(--soft);font-size:12px}
.cmt{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.cmt input{margin-top:3px}
.cmt .likes{margin-left:auto;font-size:11px;color:var(--soft);white-space:nowrap}
.player{display:flex;flex-direction:column;gap:10px}
.player .phone{width:100%}
.bar{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;gap:8px;font-size:12px}
.bar .tr{flex:1;height:4px;background:rgba(255,255,255,.35);border-radius:2px;position:relative}.bar .tr::after{content:'';position:absolute;left:0;top:0;bottom:0;width:22%;background:var(--accent);border-radius:2px}
</style>
<body><script src="icons.js"></script><script src="shell.js"></script>
<script>
const st=(k,l,s,cls)=>`<div class="st ${cls}"><span class="k">${cls==='done'?'✓':k}</span><div><b>${l}</b><small>${s}</small></div></div>`;
const scene=(n,likes,txt,editing,reply)=>`<div class="card scene ${reply?'reply':''}">
 <div class="h"><span class="chip">CẢNH #${n}</span><span class="num">${likes}</span> likes<span>· Text TTS</span>
   <span class="acts"><a class="btn sm ghost">Text gốc</a><a class="btn sm"><svg><use href="#play"/></svg>Nghe thoại</a><a class="btn sm icon"><svg><use href="#pen"/></svg></a></span></div>
 ${editing?`<textarea>${txt}</textarea><div class="row" style="justify-content:flex-end;gap:6px"><a class="btn sm ghost">Huỷ</a><a class="btn sm primary">Lưu câu này</a></div>`:`<p>${txt}</p>`}
</div>`;
shell({page:'library',title:'Tin định cư Mỹ · <span style="font-weight:400;color:var(--muted)">Cụ bà 82 tuổi ở Pomona…</span>',sub:'Lượt chạy <span class="num">#75281757</span> · kit Tin định cư Mỹ · đang chạy',body:`

 ${st(4,'Video','<span class="num">6</span> cảnh · <span class="num">0:17</span> · <span class="num">$0.00</span>','on')}<span class="arrow">→</span>
 ${st(5,'Đăng','2 nơi','')}
</div>
<div class="two">
 <div>
  ${scene(1,'bài gốc','Từ tháng 7, Úc nâng yêu cầu tiếng Anh với visa du học lên IELTS 6.0.',0)}
  ${scene(2,'bài gốc','Mức chứng minh tài chính cũng tăng thêm khoảng 21%, lên 29.710 đô la Úc.',1)}
  ${scene(3,'bài gốc','Bộ Nội vụ nói thay đổi nhằm siết dòng hồ sơ không thực chất.',0)}
  ${scene(5,'388','IELTS 6.0 giờ thành sàn, không còn đường vòng nữa.',0,1)}
  <div class="cm"><h3>Bình luận khác</h3><span class="num">3</span><a class="btn sm ghost" style="margin-left:auto">Ẩn không chọn</a></div>
  <div class="card quiet cmt"><input type="checkbox" checked><span>Đúng, trung tâm nào nữa bao đậu IELTS 6.0 thì nghĩ lại đi.</span><span class="likes"><span class="num">96</span> likes</span></div>
  <div class="card quiet cmt"><input type="checkbox"><span>Ai đã có COE rồi thì không ảnh hưởng đâu.</span><span class="likes"><span class="num">57</span> likes</span></div>
 </div>
 <div class="player">
  <div class="phone"><img src="img/frame-b.png"><div class="bar"><svg style="width:14px;height:14px"><use href="#play"/></svg><span class="tr"></span><span class="num">0:04 / 0:17</span></div></div>
  <a class="btn primary"><svg><use href="#refresh"/></svg>Chỉnh tiếp &amp; render lại</a>
  <div class="row"><a class="btn sm grow"><svg><use href="#download"/></svg>Tải về</a><a class="btn sm grow"><svg><use href="#send"/></svg>Gửi Telegram</a></div>
  <div class="card quiet ovr"><div class="t"><svg><use href="#settings"/></svg>Tuỳ chỉnh video này</div>
   <div class="kv">Kit<b>Tin định cư Mỹ</b></div><div class="kv">Thời lượng<b>Cân đối</b></div><div class="kv">Mở đầu<b>Bật</b></div><div class="kv">Nhạc nền<b>AI chọn</b></div><div class="kv">Duyệt trước<b>Bật</b></div>
   <a class="btn sm" style="align-self:flex-start;margin-top:4px">Sửa</a></div>
 </div>
</div>
<div class="card foot"><span class="sum"><span class="num">6</span> cảnh · <span class="num">0:17</span> · tổng <span class="num">$0.01</span> · đã sửa <span class="num">1</span> câu</span><span class="sp"></span><a class="btn">Chạy lại bước này</a><a class="btn primary">Tiếp tục → Đăng</a></div>`});
