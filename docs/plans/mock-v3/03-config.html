<!doctype html><meta charset="utf-8"><title>mock · Cấu hình video</title><link rel="stylesheet" href="mock.css">
<style>
.content{padding:16px 22px 0;display:flex;flex-direction:column;gap:0;height:calc(100vh - 56px)}
.stage{display:grid;grid-template-columns:72px 1fr 336px;gap:16px;flex:1;min-height:0}
.frames{display:flex;flex-direction:column;gap:6px}
.frames .f{padding:8px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.frames .f svg{width:16px;height:16px;display:block;margin:0 auto 3px}
.frames .f.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.centre{display:flex;justify-content:center;align-items:flex-start;min-height:0}
.phone{height:100%;max-height:560px;aspect-ratio:9/16}
.panel{padding:14px 16px;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:19px;display:flex;align-items:center;gap:8px}.panel h2 svg{width:20px;height:20px;stroke:var(--accent)}
.panel .lead{font-size:12.5px;color:var(--muted);margin-top:-6px}
.g{display:flex;flex-direction:column;gap:6px}
.g .t{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px}.g .t svg{width:14px;height:14px;stroke:var(--accent)}
.g select{width:100%;font-weight:600;font-size:13px}
.radio{display:flex;flex-direction:column;gap:8px}
.rc{padding:10px 12px;display:flex;gap:10px;align-items:flex-start;border:2px solid var(--pen);border-radius:var(--r);background:var(--card)}
.rc.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:3px 3px 0 var(--pen)}
.rc svg{width:16px;height:16px;flex:none;margin-top:2px;stroke:var(--accent)}
.rc b{display:block;font-size:13.5px}.rc span{font-size:12px;color:var(--muted);line-height:1.35}
.ill{display:flex;gap:12px;align-items:center;padding:10px 12px}
.ill .mini{width:56px;aspect-ratio:9/16;background:var(--stage);border-radius:6px;border:2px solid var(--pen);flex:none;position:relative}
.ill .mini::before{content:'';position:absolute;left:8px;right:8px;top:10px;height:22px;background:#fff;border-radius:3px}
.ill .mini::after{content:'';position:absolute;left:10px;right:10px;bottom:14px;height:6px;background:#F8EF63;border-radius:2px}
.ill b{font-size:13px;display:block}.ill span{font-size:11.5px;color:var(--muted)}
/* bottom strip */
.strip{display:flex;gap:8px;padding:12px 0 14px;overflow:hidden}
.tab{flex:1;min-width:0;padding:8px 10px 8px;border:2px solid var(--pen2);border-radius:8px;background:var(--card);border-top:4px solid var(--pen2);position:relative}
.tab.on{border-color:var(--accent);border-top-color:var(--accent);background:var(--accent-tint);box-shadow:3px 3px 0 var(--pen)}
.tab>b{display:flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap}.tab b svg{width:13px;height:13px;stroke:var(--accent)}
.tab small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.3;height:27px;overflow:hidden}
.tab i{position:absolute;top:-7px;right:6px;width:8px;height:8px;border-radius:99px;background:var(--accent);border:2px solid var(--card)}
.hdr{display:flex;align-items:center;gap:8px}
</style>
<body><script src="icons.js"></script><script src="shell.js"></script>
<script>
const tab=(ic,name,sum,on)=>`<div class="tab ${on?'on':''}"><b><svg><use href="#${ic}"/></svg>${name}</b><small>${sum}</small><i></i></div>`;
shell({page:'kits',title:'Cấu hình video',
right:`<select style="font-weight:700;font-size:13px;padding:5px 9px"><option>● Tin định cư Mỹ</option></select>
<span class="seg" style="display:inline-flex;border:2.5px solid var(--pen);border-radius:10px;overflow:hidden;box-shadow:3px 3px 0 var(--pen);background:var(--card)"><span style="padding:6px 10px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;display:flex;gap:5px;align-items:center"><svg style="width:14px;height:14px"><use href="#eye"/></svg>Xem trước</span><span style="padding:6px 10px;font-weight:700;font-size:13px;display:flex;gap:5px;align-items:center"><svg style="width:14px;height:14px"><use href="#layers"/></svg>Chỉnh lớp</span></span>
<a class="btn sm"><svg><use href="#list"/></svg>Xem cấu hình</a>`,
body:`
<div class="stage">
  <div class="frames"><div class="card f on"><svg><use href="#frame"/></svg>Thân</div><div class="card quiet f"><svg><use href="#zap"/></svg>Mở đầu</div><div class="card quiet f"><svg><use href="#image"/></svg>Bìa</div></div>
  <div class="centre"><div class="phone"><img src="img/frame-a.png"><span class="tag">ẢNH BÀI VIẾT · CẢNH 2</span></div></div>
  <div class="card panel">
    <h2><svg><use href="#filetext"/></svg>Nội dung</h2>
    <div class="lead">Video nói tiếng gì, kể theo cách nào, chọn bình luận ra sao và dài tối đa bao lâu.</div>
    <div class="g"><div class="t"><svg><use href="#type"/></svg>Ngôn ngữ video</div><select><option>Tiếng Việt</option></select><div class="help">Bài tiếng Anh, tiếng Đức… đều được dịch sang Việt trước khi dựng.</div></div>
    <div class="g"><div class="t"><svg><use href="#pen"/></svg>Cách kể</div>
      <div class="radio">
        <div class="rc on"><svg><use href="#filetext"/></svg><div><b>Đọc nguyên văn</b><span>Đọc đúng chữ của bài đăng và các bình luận đã chọn.</span></div></div>
        <div class="rc"><svg><use href="#sparkles"/></svg><div><b>AI tự viết</b><span>AI đọc bài, chọn ý nổi bật, viết lời dẫn ~500 từ theo SOP rồi mới đọc.</span></div></div>
        <div class="card quiet ill"><div class="mini"></div><div><b>Đọc nguyên văn</b><span>Lời thoại là ĐÚNG chữ trên card — đọc đến đâu, phụ đề hiện đúng câu đó.</span></div></div>
      </div></div>
    <div class="g"><div class="t"><svg><use href="#msg"/></svg>Chọn bình luận</div><select><option>AI tự chọn</option></select></div>
  </div>
</div>
<div class="strip">
${tab('tv','Thương hiệu','<b class="num">2</b> chủ đề · <b class="num">3</b> hashtag')}
${tab('filetext','Nội dung','Đọc nguyên văn · <b class="num">~500</b> từ',1)}
${tab('mic','Giọng đọc','HoaiMy · tốc độ <b class="num">1.25×</b>')}
${tab('frame','Khung hình','Nhiều khung · ảnh nền tối')}
${tab('image','Ảnh chụp bài viết','Card sáng · chữ <b class="num">104</b>px')}
${tab('captions','Phụ đề','Đậm · nhấn từ · <b class="num">64</b>px')}
${tab('sig','Chữ ký kênh','DVD tắt · watermark bật')}
${tab('sticker','Nhãn dán','Bật · bộ Thỏ hồng')}
</div>`});
</script></body>
